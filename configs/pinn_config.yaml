# PINN Training Configuration

# Model architecture
hidden_dims: [128, 128, 64]
dropout: 0.1

# Training hyperparameters
num_epochs: 100
batch_size: 64
learning_rate: 0.001
weight_decay: 0.00001
train_split: 0.8

# Physics loss weight
physics_lambda: 0.1  # Weight for physics constraint loss

# Time step for physics equation (seconds)
delta_t: 60.0

# Data normalization
normalize: true


